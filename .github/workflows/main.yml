name: "JFrog-GitHub NPM Publish OIDC Integration"
on: push

permissions:
  id-token: write   # Required for OIDC token exchange
  contents: read    # Required for actions/checkout

jobs:
  build:
    runs-on: self-hosted   # or ubuntu-latest
    env:
      OIDC_AUDIENCE: 'jfrog-github'
      OIDC_PROVIDER: 'anjalis-github-repository'
      PLATFORM_REPO: 'npm-local1'

    defaults:
      run:
        working-directory: ./package

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner egress IP
        working-directory: ${{ github.workspace }}
        run: |
          echo "Runner hostname: $(hostname)"
          echo "Egress IP (ifconfig.me): $(curl -s https://ifconfig.me)"
          echo "Egress IP (ipify): $(curl -s https://api.ipify.org)"

      - name: Decode OIDC token
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          ID_TOKEN=$(curl -sLS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" | jq -r .value)

          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "Failed to fetch ID token"
            exit 1
          fi

          echo "===== OIDC JWT claims ====="
          PAYLOAD=$(echo "$ID_TOKEN" | cut -d. -f2 | tr '_-' '/+')
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          [ "$PAD" -eq 0 ] || PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PAD))"

          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq .
          echo "===== iss / aud / repository / actor ====="
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{iss, aud, repository, actor, sub}'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JFROG_CLI_LOG_LEVEL: DEBUG
        with:
          oidc-provider-name: ${{ env.OIDC_PROVIDER }}
          oidc-audience: ${{ env.OIDC_AUDIENCE }}

      - name: Debug JFrog CLI config
        working-directory: ${{ github.workspace }}
        run: |
          echo "JF_URL=${{ secrets.JF_URL }}"
          echo "OIDC_PROVIDER=$OIDC_PROVIDER"
          echo "OIDC_AUDIENCE=$OIDC_AUDIENCE"
          echo "Token set? $([ -n \"$JF_ACCESS_TOKEN\" ] && echo yes || echo no)"
          echo "Token length: ${#JF_ACCESS_TOKEN}"
          jf config show || true
          jf config use setup-jfrog-cli-server || true
          jf rt ping --server-id setup-jfrog-cli-server || jf rt ping || true

      - name: Set CLI Config
        run: jf npm-config --global=true --repo-resolve=$PLATFORM_REPO --repo-deploy=$PLATFORM_REPO

      - name: Install Dependencies
        run: jf npm install

      - name: Run tests
        run: npm test

      - name: Publish
        run: jf npm publish

      - name: Publish Build info
        run: |
          jf rt build-collect-env
          jf rt build-add-git
          jf rt build-publish

